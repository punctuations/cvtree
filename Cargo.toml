[workspace]
resolver = "2"
members = ["cvtree", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cvtree = { path = "cvtree" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
anyhow = "1"
thiserror = "2"
